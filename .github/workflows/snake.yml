name: Snake Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/profile-snake-contrib/github-contribution-grid-snake.svg
            dist/profile-snake-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Copy generated files into repository
        run: |
          mkdir -p profile-snake-contrib
          cp dist/profile-snake-contrib/* profile-snake-contrib/

      - name: Commit and push generated files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-snake-contrib
          git diff --cached --quiet || git commit -m "generated contribution snake"
          git push
